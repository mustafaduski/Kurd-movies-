<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | لیستا مەزن یا فیلمـان</title>
    <style>
        :root {
            --accent: #ffcc00;
            --bg: #08090a;
            --card-bg: #111418;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #000;
        }

        #bgVideo {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: brightness(30%);
        }

        .hero-content { z-index: 1; width: 100%; }
        .logo { font-size: 50px; font-weight: 900; color: var(--accent); text-transform: uppercase; margin-bottom: 15px; }
        .search-box {
            width: 85%; max-width: 500px; padding: 15px 25px;
            border-radius: 30px; border: 2px solid var(--accent);
            background: rgba(0,0,0,0.7); color: white; outline: none; font-size: 18px;
        }

        /* Movie Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px; padding: 40px 5%;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            cursor: pointer;
            transition: 0.4s;
            opacity: 0;
            transform: translateY(30px);
        }

        .movie-card.show { opacity: 1; transform: translateY(0); }
        .movie-card:hover { transform: scale(1.05); border-color: var(--accent); }
        .poster { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 12px; text-align: center; }
        .info h3 { font-size: 16px; margin: 5px 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; overflow-y: auto; }
        .modal-content { width: 90%; max-width: 1000px; margin: 50px auto; background: #111; border-radius: 15px; position: relative; }
        iframe { width: 100%; aspect-ratio: 16/9; border-radius: 15px 15px 0 0; border: none; }
        .details-box { padding: 25px; text-align: right; }
        .close-btn { position: absolute; top: -45px; right: 0; background: var(--accent); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        @media (max-width: 600px) { .container { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

<div class="hero-section">
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-clapperboard-and-film-reels-in-dark-studio-34538-large.mp4" type="video/mp4">
    </video>
    <div class="hero-content">
        <div class="logo">Movies<span>4U</span></div>
        <input type="text" id="searchInp" class="search-box" onkeyup="render()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    </div>
</div>

<div class="container" id="movieList"></div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeVideo()">✕ داخستن</button>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
        <div class="details-box">
            <h2 id="mTitle" style="color: var(--accent); margin: 0;"></h2>
            <p id="mMeta" style="color: #888;"></p>
            <p id="mDesc" style="line-height: 1.6;"></p>
        </div>
    </div>
</div>

    function render() {
        const list = document.getElementById('movieList');
        const search = document.getElementById('searchInp').value.toLowerCase();
        list.innerHTML = '';
        movies.filter(m => m.title.toLowerCase().includes(search)).forEach(m => {
            list.innerHTML += `
                <div class="movie-card" onclick="openVideo(${m.id})">
                    <img src="${m.poster}" class="poster">
                    <div class="info"><h3>${m.title}</h3><p>${m.year}</p></div>
                </div>`;
        });
        setTimeout(reveal, 100);
    }

    function reveal() {
        document.querySelectorAll(".movie-card").forEach(c => {
            if (c.getBoundingClientRect().top < window.innerHeight - 50) c.classList.add("show");
        });
    }

    function openVideo(id) {
        const m = movies.find(x => x.id === id);
        document.getElementById('videoFrame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mMeta').innerText = `${m.year} • ${m.cat} • ⭐ ${m.rate}`;
        document.getElementById('mDesc').innerText = m.desc;
        document.getElementById('videoModal').style.display = 'block';
    }

    function closeVideo() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('videoFrame').src = '';
    }

    window.addEventListener("scroll", reveal);
    render();
</script>

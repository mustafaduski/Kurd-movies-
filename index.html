<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | سینەمایا جوولاو</title>
    <style>
        :root {
            --accent: #ffcc00;
            --bg: #08090a;
            --card-bg: #111418;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Hero Section دگەل ڤیدیۆ */
        .hero-section {
            position: relative;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        #bgVideo {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: brightness(40%); /* تاریتر دکەت دا کو نڤیسین دیار بیت */
        }

        .hero-content { z-index: 1; width: 100%; }

        .logo {
            font-size: 50px;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .search-box {
            width: 80%;
            max-width: 500px;
            padding: 15px 25px;
            border-radius: 30px;
            border: 2px solid var(--accent);
            background: rgba(0,0,0,0.6);
            color: white;
            outline: none;
            font-size: 18px;
            backdrop-filter: blur(5px);
        }

        /* Movie Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            padding: 40px 5%;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s ease;
            border: 1px solid #222;
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover { transform: translateY(-10px); border-color: var(--accent); }

        .poster { width: 100%; height: 320px; object-fit: cover; }

        .rating-tag {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px; font-weight: bold;
        }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content { width: 90%; max-width: 1000px; margin: 50px auto; background: #141414; border-radius: 15px; position: relative; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .details-box { padding: 25px; text-align: right; }
        .close-btn { position: absolute; top: -45px; right: 0; background: var(--accent); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr 1fr; gap: 15px; }
            .hero-section { height: 300px; }
            .logo { font-size: 35px; }
        }
    </style>
</head>
<body>

<div class="hero-section">
    <video autoplay muted loop id="bgVideo">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-clapperboard-and-film-reels-in-dark-studio-34538-large.mp4" type="video/mp4">
    </video>

    <div class="hero-content">
        <div class="logo">Movies<span>4U</span></div>
        <input type="text" id="searchInp" class="search-box" onkeyup="render()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    </div>
</div>

<div class="container" id="movieList"></div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeVideo()">✕ داخستن</button>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
        <div class="details-box">
            <h2 id="mTitle" style="color: var(--accent); margin: 0;"></h2>
            <p id="mMeta" style="color: #888; margin: 10px 0;"></p>
            <p id="mDesc" style="line-height: 1.6; font-size: 16px;"></p>
        </div>
    </div>
</div>

<script>
    const movies = [
        { id: 0, title: "Interstellar", cat: "زانستی", year: "2014", rate: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", desc: "گەشتەکا پڕی مەترسی دناڤ کونێن ڕەش دا بۆ قورتالکرنا مرۆڤایەتیێ پشتی زەوی تووشی قەیرانەکا مەزن دبیت." },
        { id: 1, title: "The Dark Knight", cat: "ئەکشن", year: "2008", rate: "9.0", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/EXeTwQWrcwY", desc: "باتمان ڕووبەڕووی مەزنترین دوژمنێ خۆ دبیتەوە کو جۆکەرە." },
        { id: 2, title: "Joker", cat: "دراما", year: "2019", rate: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", link: "https://www.youtube.com/embed/t433PEQGErc", desc: "چیرۆکا شکەستنا مروڤەکی و پەیدابوونا جۆکەری." }
    ];

    function render() {
        const list = document.getElementById('movieList');
        const search = document.getElementById('searchInp').value.toLowerCase();
        list.innerHTML = '';
        movies.filter(m => m.title.toLowerCase().includes(search)).forEach(m => {
            list.innerHTML += `
                <div class="movie-card" onclick="openVideo(${m.id})">
                    <span class="rating-tag">⭐ ${m.rate}</span>
                    <img src="${m.poster}" class="poster">
                    <div class="info"><h3>${m.title}</h3><p>${m.year} • ${m.cat}</p></div>
                </div>`;
        });
    }

    function openVideo(id) {
        const m = movies.find(x => x.id === id);
        document.getElementById('videoFrame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mMeta').innerText = `${m.year} • ${m.cat} • ⭐ ${m.rate}`;
        document.getElementById('mDesc').innerText = m.desc;
        document.getElementById('videoModal').style.display = 'block';
    }

    function closeVideo() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('videoFrame').src = '';
    }

    render();
</script>
</body>
</html>

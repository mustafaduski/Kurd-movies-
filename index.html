<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کوردی سینەما - باشترین فیلم ب کوردی</title>
    <style>
        /* CSS بۆ جوانکرنا وێبسایتی */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: white;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .movie-card {
            background-color: #222;
            margin: 15px;
            width: 200px;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid #333;
        }
        .movie-card:hover {
            transform: scale(1.05);
            border-color: #e50914;
        }
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .movie-info {
            padding: 10px;
            text-align: center;
        }
        .movie-info h3 {
            font-size: 16px;
            margin: 10px 0;
        }
        .btn-watch {
            display: inline-block;
            padding: 8px 15px;
            background-color: #e50914;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>سینەما ب کوردی</h1>
    <p>ب خێرهاتی بۆ مالپەرێ لێگەریانا فیلمێن کوردی</p>
</header>

<div class="container">
    
    <div class="movie-card">
        <img src="https://via.placeholder.com/200x300?text=Movie+1" alt="فیلم">
        <div class="movie-info">
            <h3>ناڤێ فیلمی لێرە بنێڤیسە</h3>
            <a href="#" class="btn-watch">تەماشە بکە</a>
        </div>
    </div>

    <div class="movie-card">
        <img src="https://via.placeholder.com/200x300?text=Movie+2" alt="فیلم">
        <div class="movie-info">
            <h3>فیلمێ ئەکشن ب کوردی</h3>
            <a href="#" class="btn-watch">تەماشە بکە</a>
        </div>
    </div>

    <div class="movie-card">
        <img src="https://via.placeholder.com/200x300?text=Movie+3" alt="فیلم">
        <div class="movie-info">
            <h3>فیلمێ کارتۆن</h3>
            <a href="#" class="btn-watch">تەماشە بکە</a>
        </div>
    </div>

</div>

</body>
</html>

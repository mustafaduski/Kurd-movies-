<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Auto-Engine</title>
    <style>
        :root { --accent: #ffcc00; --bg: #08080a; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: white; }
        
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; z-index: 1000;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #222; box-sizing: border-box;
        }

        .container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; padding: 100px 5% 50px; 
        }

        .card { 
            background: #111; border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; border: 1px solid #222;
        }
        .card:hover { transform: scale(1.05); border-color: var(--accent); }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; font-size: 13px; }

        .loading-text { grid-column: 1/-1; text-align: center; margin-top: 50px; color: var(--accent); }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 24px; font-weight: 900; color: var(--accent);">AUTO MOVIES</div>
    <input type="text" id="search" placeholder="بگەڕێ..." style="padding: 8px; border-radius: 20px; border: none;" onkeyup="searchAuto()">
</nav>

<div class="container" id="movieGrid">
    <div class="loading-text">ل هیڤیا بارکرنا هزاران فیلمان بە... 🍿</div>
</div>

<script>
    // ئەڤە کلیلەکا جیهانییە بۆ تاقیکردنێ
    const API_KEY = '82650220645068a8cf72d421d234a413'; 
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

    // ١. ئینانا فیلمان ب شێوەیەکێ ئۆتۆماتیک
    async function fetchMovies(url) {
        try {
            const res = await fetch(url);
            const data = await res.json();
            displayMovies(data.results);
        } catch (error) {
            document.getElementById('movieGrid').innerHTML = "<h2>کێشەیەک د ئینتەرنێتێ دا هەیە، VPN ڤەکە!</h2>";
        }
    }

    // ٢. نیشاندانا فیلمان
    function displayMovies(movies) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = '';
        movies.forEach(m => {
            if(!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${IMG_PATH + m.poster_path}" alt="${m.title}">
                <div class="card-info">
                    <h3>${m.title}</h3>
                    <span>⭐ ${m.vote_average}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ٣. گەڕیان د ناڤ داتابەیسەکا مەزن دا
    function searchAuto() {
        const term = document.getElementById('search').value;
        if(term) {
            fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${term}`);
        } else {
            fetchMovies(`https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);
        }
    }

    // دەستپێکرنا سیستەمی
    fetchMovies(`https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | AI Powered Cinema</title>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
        
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            background-attachment: fixed; color: white; overflow-x: hidden;
        }

        /* Modern Navbar */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; 
            align-items: center; padding: 15px 5%; z-index: 1000; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;
        }

        .search-box {
            background: rgba(255,255,255,0.1); border: 1px solid #333; padding: 10px 20px;
            border-radius: 25px; color: white; width: 280px; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--accent); width: 350px; box-shadow: 0 0 15px rgba(255,204,0,0.2); }

        /* Movie Container */
        .container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 30px; padding: 120px 5% 50px; 
        }

        .card {
            background: var(--glass); border-radius: 20px; overflow: hidden;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 1px solid rgba(255,255,255,0.05); cursor: pointer; position: relative;
        }
        .card:hover { transform: scale(1.08); border-color: var(--accent); box-shadow: 0 15px 40px rgba(0,0,0,0.7); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-info { padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        .card-info h3 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info span { color: var(--accent); font-weight: bold; font-size: 13px; }

        /* Immersive Player Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 5000; overflow-y: auto; }
        .modal-inner { width: 90%; max-width: 1100px; margin: 40px auto; }
        .video-wrapper { border-radius: 25px; overflow: hidden; box-shadow: 0 0 50px var(--accent); background: #000; position: relative; padding-top: 56.25%; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .close-btn { position: fixed; top: 25px; left: 25px; background: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; font-weight: bold; z-index: 6000; }
        
        @media (max-width: 600px) { .container { grid-template-columns: 1fr 1fr; gap: 15px; } .search-box { width: 150px; } }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 26px; font-weight: 900; color: var(--accent); cursor: pointer;" onclick="getMovies()">MOVIES4U</div>
    <input type="text" id="searchInput" class="search-box" placeholder="ناڤێ فیلمی بنڤیسە..." onkeyup="searchMovies()">
</nav>

<div class="container" id="movieGrid">
    </div>

<div id="modal" class="modal">
    <button class="close-btn" onclick="closeM()">✕</button>
    <div class="modal-inner">
        <div class="video-wrapper">
            <iframe id="frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <h1 id="mTitle" style="color: var(--accent); margin-top: 30px; font-size: 35px;"></h1>
        <p id="mDesc" style="color: #ccc; line-height: 1.8; font-size: 18px;"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U Kurdish | سینەما ب کوردی</title>
    <style>
        :root {
            --accent: #ffc107;
            --bg: #0b0c10;
            --card-bg: #1a1d24;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        header {
            background-color: #000;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 16px;
        }

        /* Categories Filter */
        .filter-container {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: black;
            border-color: var(--accent);
        }

        /* Movies Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            padding: 20px 5%;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.4s ease;
            border: 1px solid #2a2e38;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
        }

        .poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .rating-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
        }

        .info {
            padding: 15px;
            text-align: center;
        }

        .info h3 {
            margin: 0 0 5px;
            font-size: 17px;
            color: var(--accent);
        }

        .info p {
            font-size: 13px;
            color: #aaa;
            margin: 0 0 15px;
        }

        .watch-btn {
            display: block;
            background: var(--accent);
            color: black;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .watch-btn:hover {
            background: #e0a800;
        }

        @media (max-width: 600px) {
            .movie-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .poster { height: 230px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Movies<span>4U</span></div>
    <input type="text" id="searchInput" class="search-box" onkeyup="render()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    
    <div class="filter-container">
        <button class="filter-btn active" onclick="setCategory('all', this)">هەمی</button>
        <button class="filter-btn" onclick="setCategory('action', this)">ئەکشن</button>
        <button class="filter-btn" onclick="setCategory('drama', this)">دراما</button>
        <button class="filter-btn" onclick="setCategory('animation', this)">کارتۆن</button>
    </div>
</header>

<div class="movie-grid" id="movieList">
    </div>

<script>
    let movies = [];
    let currentCat = 'all';

    // کێشانا فیلمـان ژ JSON
    async function loadMovies() {
        try {
            const res = await fetch('movies.json');
            movies = await res.json();
            render();
        } catch (e) {
            console.log("Error loading JSON. Make sure movies.json exists.");
        }
    }

    function setCategory(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const container = document.getElementById('movieList');
        const search = document.getElementById('searchInput').value.toLowerCase();
        container.innerHTML = '';

        movies.forEach(m => {
            const matchesSearch = m.title.toLowerCase().includes(search);
            const matchesCat = (currentCat === 'all' || m.category === currentCat);

            if (matchesSearch && matchesCat) {
                container.innerHTML += `
                    <div class="movie-card">
                        <span class="rating-tag">⭐ ${m.rating}</span>
                        <img src="${m.poster}" class="poster">
                        <div class="info">
                            <h3>${m.title}</h3>
                            <p>${m.year} | ${m.category}</p>
                            <a href="${m.link}" class="watch-btn">تەماشە بکە</a>
                        </div>
                    </div>
                `;
            }
        });
    }

    loadMovies();
</script>

</body>
</html>

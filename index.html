<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U Kurdish | سینەما ب کوردی</title>
    <style>
        /* ستایلێ گشتی یێ هاوشێوەی Movies4U */
        :root {
            --primary-color: #ffcc00; /* رەنگێ زەرا تایبەت ب Movies4U */
            --bg-body: #0f1014;
            --bg-card: #1a1d24;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* Navbar و Search */
        nav {
            background-color: #000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        .search-box {
            position: relative;
            width: 40%;
        }

        #searchInput {
            width: 100%;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #252830;
            color: white;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--primary-color);
        }

        /* بەشێ فیلمـان */
        .container {
            padding: 30px 5%;
        }

        .section-title {
            border-right: 4px solid var(--primary-color);
            padding-right: 15px;
            margin-bottom: 25px;
            font-size: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid #2a2e38;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        /* وێنێ فیلمی */
        .poster-wrapper {
            position: relative;
            height: 260px;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--primary-color);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* ناڤ و پیزانی */
        .movie-detail {
            padding: 12px;
            text-align: center;
        }

        .movie-detail h3 {
            margin: 0;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-year {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            display: block;
        }

        .hidden { display: none; }

        /* موبایل */
        @media (max-width: 768px) {
            .search-box { width: 60%; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">MOVIES<span>4U</span></div>
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="searchMovie()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    </div>
</nav>

<div class="container">
    <h2 class="section-title">دووماهیک فیلمێن هاتینە زێدەکرن</h2>
    
    <div class="movie-grid" id="movieList">
        
        <div class="movie-card" onclick="location.href='#'">
            <div class="poster-wrapper">
                <span class="rating">8.8</span>
                <img src="https://m.media-amazon.com/images/M/MV5BMDFkYTc0MGEtZmNhMC00ZDIzLWFmNTEtODM1ZmRlYWMwMWFmXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" alt="Inception">
            </div>
            <div class="movie-detail">
                <h3 class="title">Inception</h3>
                <span class="movie-year">2010 • ئەکشن</span>
            </div>
        </div>

        <div class="movie-card" onclick="location.href='#'">
            <div class="poster-wrapper">
                <span class="rating">9.0</span>
                <img src="https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg" alt="The Dark Knight">
            </div>
            <div class="movie-detail">
                <h3 class="title">The Dark Knight</h3>
                <span class="movie-year">2008 • دراما</span>
            </div>
        </div>

        <div class="movie-card" onclick="location.href='#'">
            <div class="poster-wrapper">
                <span class="rating">7.9</span>
                <img src="https://m.media-amazon.com/images/M/MV5BN2EyZjM3NzUtNWUzMi00MTgxLWI0NTctMzY4M2VlOTdjZWRiXkEyXkFqcGdeQXVyNDUzOTQ5MjY@._V1_.jpg" alt="John Wick">
            </div>
            <div class="movie-detail">
                <h3 class="title">John Wick</h3>
                <span class="movie-year">2014 • ئەکشن</span>
            </div>
        </div>

        <div class="movie-card" onclick="location.href='#'">
            <div class="poster-wrapper">
                <span class="rating">8.1</span>
                <img src="https://m.media-amazon.com/images/M/MV5BNGVjN3RkNTktMjZlRC00YTcyLThjNjUtMjcxMTBkMGZkGvV1_FMjpg_UX1000_.jpg" alt="Deadpool">
            </div>
            <div class="movie-detail">
                <h3 class="title">Deadpool</h3>
                <span class="movie-year">2016 • کۆمیدی</span>
            </div>
        </div>

    </div>
</div>

<script>
    function searchMovie() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('movie-card');
        
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].querySelector('.title').innerText.toLowerCase();
            if (title.includes(input)) {
                cards[i].classList.remove('hidden');
            } else {
                cards[i].classList.add('hidden');
            }
        }
    }
</script>

</body>
</html>

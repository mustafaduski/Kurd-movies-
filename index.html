<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Netflix Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;900&display=swap');
        
        :root { --accent: #e50914; --bg: #050505; }
        body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }

        /* Navbar */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; z-index: 2000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            transition: 0.5s; box-sizing: border-box;
        }

        /* SlideShow Header */
        .hero {
            position: relative; width: 100%; height: 80vh; overflow: hidden;
            display: flex; align-items: center; justify-content: flex-start;
        }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1s ease-in-out;
            display: flex; align-items: center; padding: 0 8%;
        }
        .slide.active { opacity: 1; }
        .slide::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, var(--bg), transparent);
        }
        .hero-content { position: relative; z-index: 10; max-width: 600px; }
        .hero-content h1 { font-size: 50px; margin: 0; color: var(--accent); text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }

        /* Containers */
        .section-title { padding: 40px 5% 10px; font-size: 22px; font-weight: bold; }
        .container { 
            display: flex; gap: 15px; padding: 10px 5% 40px; 
            overflow-x: auto; scrollbar-width: none;
        }
        .container::-webkit-scrollbar { display: none; }
        
        .card { 
            min-width: 180px; background: #111; border-radius: 8px; overflow: hidden; 
            transition: 0.3s; border: 1px solid #222; cursor: pointer;
        }
        .card:hover { transform: scale(1.1); z-index: 100; border-color: white; }
        .card img { width: 100%; height: 260px; object-fit: cover; }

        @media (max-width: 600px) { .hero-content h1 { font-size: 30px; } .hero { height: 50vh; } }
    </style>
</head>
<body>

<nav id="navbar">
    <div style="font-size: 28px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <div style="background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 14px;">گەڕیان 🔍</div>
</nav>

<div class="hero" id="hero">
    <div class="slide active" style="background-image: linear-gradient(to right, rgba(0,0,0,0.8), transparent), url('https://wallpapercave.com/wp/wp3892015.jpg');">
        <div class="hero-content">
            <h1>INTERSTELLAR</h1>
            <p>گەشتەکا گەردوونی کو چاڤەڕێی تە دکەت...</p>
        </div>
    </div>
    <div class="slide" style="background-image: linear-gradient(to right, rgba(0,0,0,0.8), transparent), url('https://wallpapercave.com/wp/wp4447475.jpg');">
        <div class="hero-content">
            <h1>THE JOKER</h1>
            <p>چیرۆکا تاری یا ئارسەر فلێک و باژێرێ گۆثەم.</p>
        </div>
    </div>
</div>

<div class="section-title">🎙️ دۆبلاژکریێن کوردی</div>
<div class="container" id="dubbedList"></div>

<div class="section-title">🌍 فیلمێن جیهانی</div>
<div class="container" id="globalList"></div>

<script>
    // ١. سیستەمێ SlideShow
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    function nextSlide() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }
    setInterval(nextSlide, 5000); // هەر ٥ چرکەیا دگوهۆڕیت

    // ٢. داتایێن فیلمـان
    const API_KEY = '82650220645068a8cf72d421d234a413';
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

    async function fetchMovies() {
        try {
            const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc`);
            const data = await res.json();
            
            const globalGrid = document.getElementById('globalList');
            const dubbedGrid = document.getElementById('dubbedList');

            // فیلمێن جیهانی
            globalGrid.innerHTML = data.results.map(m => `
                <div class="card">
                    <img src="${IMG_PATH + m.poster_path}">
                    <div style="padding:10px; font-size:12px; text-align:center;">${m.title}</div>
                </div>
            `).join('');

            // فیلمێن دۆبلاژ (وەک نموونە)
            dubbedGrid.innerHTML = data.results.slice(5, 15).map(m => `
                <div class="card">
                    <img src="${IMG_PATH + m.poster_path}">
                    <div style="padding:10px; font-size:12px; text-align:center;">${m.title} (دۆبلاژ)</div>
                </div>
            `).join('');

        } catch (e) { console.log("Error fetching data"); }
    }

    // گوهۆڕینا ڕەنگێ Navbar دەمێ سکرۆڵ دکەی
    window.onscroll = function() {
        if (window.scrollY > 50) document.getElementById('navbar').style.background = "#050505";
        else document.getElementById('navbar').style.background = "transparent";
    };

    fetchMovies();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Full Platform</title>
    <style>
        :root { --accent: #ffcc00; --bg: #0b0c10; --card-bg: #1f2833; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        /* Navigation */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 5%; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--accent);
        }
        .user-zone { display: flex; align-items: center; gap: 15px; }
        .btn { background: var(--accent); color: black; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* Tabs Selection */
        .tab-bar { display: flex; justify-content: center; gap: 30px; padding: 20px; background: #111; }
        .tab-item { cursor: pointer; font-size: 18px; opacity: 0.6; transition: 0.3s; }
        .tab-item.active { opacity: 1; color: var(--accent); border-bottom: 2px solid var(--accent); }

        /* Grid & Blur */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; padding: 40px 5%; transition: 0.5s; }
        .locked-grid { filter: blur(15px); pointer-events: none; }
        
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: 0.4s; cursor: pointer; position: relative; }
        .card:hover { transform: scale(1.05); }
        .poster { width: 100%; height: 280px; object-fit: cover; }
        .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: black; padding: 2px 7px; border-radius: 5px; font-weight: bold; font-size: 12px; }

        /* Modal Player */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 3000; overflow-y: auto; }
        .modal-content { width: 95%; max-width: 1000px; margin: 40px auto; background: #000; border-radius: 20px; position: relative; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 20px 20px 0 0; }
        .details { padding: 25px; }
        .close-m { position: absolute; top: -45px; right: 0; color: white; background: none; border: none; font-size: 30px; cursor: pointer; }

        /* Auth Modal */
        .auth-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 4000; }
        .auth-form { width: 300px; background: #111; margin: 150px auto; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid var(--accent); }
        .auth-form input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }

        .lock-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 500; text-align: center; display: none; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 24px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <div class="user-zone" id="userZone"></div>
</nav>

<div class="lock-overlay" id="lockMsg">
    <h1 style="font-size: 40px;">🔒 پلاتفۆڕم یا قفلە</h1>
    <p>بۆ تەماشەکرنا فیلم و زنجیرەیان، تکایە بچۆ د ژوورڤە</p>
    <button class="btn" onclick="openAuth(true)">چوونەژوورێ</button>
</div>

<div class="tab-bar">
    <div class="tab-item active" id="tab-movie" onclick="setTab('movie')">🎬 فیلم</div>
    <div class="tab-item" id="tab-show" onclick="setTab('show')">📺 زنجیرە</div>
</div>

<div class="container" id="mainGrid"></div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <button class="close-m" onclick="closeVideo()">✕</button>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
        <div class="details">
            <h1 id="mTitle" style="color: var(--accent); margin:0;"></h1>
            <p id="mMeta" style="color: #888;"></p>
            <p id="mDesc" style="line-height: 1.6;"></p>
            <hr style="border: 0.5px solid #222; margin: 20px 0;">
            <h3>💬 ڕایێن بینەران</h3>
            <div id="opList" style="background: #111; padding: 15px; border-radius: 10px;"></div>
        </div>
    </div>
</div>

<div id="authModal" class="auth-modal">
    <div class="auth-form">
        <h2 style="color: var(--accent);">خۆ تۆماربکە</h2>
        <input type="text" id="uName" placeholder="ناڤێ تە">
        <button class="btn" style="width: 100%;" onclick="login()">بەردەوام بە</button>
    </div>
</div>

<script>
    const data = [
        { id: 0, type: 'movie', title: "Interstellar", year: "2014", rate: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", desc: "گەشتەکا زانستی بۆ قورتالکرنا مرۆڤایەتیێ." },
        { id: 1, type: 'movie', title: "Joker", year: "2019", rate: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", link: "https://www.youtube.com/embed/t433PEQGErc", desc: "چیرۆکا سەرەلبوونا ئارسەر فڵێک." },
        { id: 2, type: 'show', title: "Breaking Bad", year: "2008", rate: "9.5", poster: "https://m.media-amazon.com/images/M/MV5BMjhiMzgxZTctNDc1Ni00OTIxLTlhMTUtMzQ3NzQ4NmOtM2Q2XkEyXkFqcGdeQXVyMzE4MDkyNTA@._V1_.jpg", link: "https://www.youtube.com/embed/HhesaQXLuRY", desc: "مامۆستایەکێ کیمیا جیهانێ دلهەژینیت." }
    ];

    let currentTab = 'movie';

    function setTab(t) {
        currentTab = t;
        document.getElementById('tab-movie').classList.toggle('active', t==='movie');
        document.getElementById('tab-show').classList.toggle('active', t==='show');
        render();
    }

    function render() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.filter(i => i.type === currentTab).map(i => `
            <div class="card" onclick="openVideo(${i.id})">
                <span class="badge">⭐ ${i.rate}</span>
                <img src="${i.poster}" class="poster">
                <div style="padding:10px; text-align:center;"><h3>${i.title}</h3><p>${i.year}</p></div>
            </div>
        `).join('');
    }

    function openVideo(id) {
        const item = data.find(x => x.id === id);
        document.getElementById('videoFrame').src = item.link;
        document.getElementById('mTitle').innerText = item.title;
        document.getElementById('mMeta').innerText = `${item.year} • ⭐ ${item.rate}`;
        document.getElementById('mDesc').innerText = item.desc;
        document.getElementById('opList').innerHTML = "دەستخۆش، فیلمەکێ نایاب بوو!";
        document.getElementById('videoModal').style.display = 'block';
    }

    function closeVideo() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('videoFrame').src = '';
    }

    function openAuth(s) { document.getElementById('authModal').style.display = s ? 'block' : 'none'; }

    function login() {
        const n = document.getElementById('uName').value;
        if(!n) return;
        localStorage.setItem('moviesUser', n);
        openAuth(false);
        checkUser();
    }

    function logout() {
        localStorage.removeItem('moviesUser');
        checkUser();
    }

    function checkUser() {
        const user = localStorage.getItem('moviesUser');
        const grid = document.getElementById('mainGrid');
        const lock = document.getElementById('lockMsg');
        const zone = document.getElementById('userZone');

        if(user) {
            grid.classList.remove('locked-grid');
            lock.style.display = 'none';
            zone.innerHTML = `<span>👤 ${user}</span> <button class="btn" style="background:#ff4757" onclick="logout()">Logout</button>`;
        } else {
            grid.classList.add('locked-grid');
            lock.style.display = 'block';
            zone.innerHTML = `<button class="btn" onclick="openAuth(true)">چوونەژوورێ</button>`;
        }
        render();
    }

    checkUser();
</script>
</body>
</html>

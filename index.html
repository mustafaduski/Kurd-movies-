<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Stable Version</title>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: #050505; color: white; overflow-x: hidden;
        }
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; 
            align-items: center; padding: 15px 5%; z-index: 1000; background: rgba(0,0,0,0.95);
            border-bottom: 1px solid #222; box-sizing: border-box;
        }
        .search-box { background: #1a1a1a; border: 1px solid #333; padding: 10px 20px; border-radius: 25px; color: white; width: 250px; outline: none; }
        
        .container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 20px; padding: 100px 5% 50px; 
        }
        .card { background: #111; border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; border: 1px solid #222; }
        .card:hover { transform: scale(1.05); border-color: var(--accent); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; }
        .card-info h3 { font-size: 14px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; overflow-y: auto; }
        .close-btn { position: fixed; top: 20px; left: 20px; background: var(--accent); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 600px) { .container { grid-template-columns: 1fr 1fr; gap: 10px; } }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 24px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <input type="text" id="searchInput" class="search-box" placeholder="ل ناڤ فیلمان بگەڕێ..." onkeyup="searchMovies()">
</nav>

<div class="container" id="movieGrid"></div>

<div id="modal" class="modal">
    <button class="close-btn" onclick="closeM()">✕</button>
    <div style="width: 90%; max-width: 1000px; margin: 50px auto; text-align: center;">
        <div style="position: relative; padding-top: 56.25%; border-radius: 15px; overflow: hidden; background: #111;">
            <iframe id="frame" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <h1 id="mTitle" style="color: var(--accent); margin-top: 25px;"></h1>
        <p id="mDesc" style="color: #bbb; line-height: 1.6; font-size: 18px;"></p>
    </div>
</div>

<script>
    const movies = [
        { title: "Interstellar", rating: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", desc: "گەشتەکا گەردوونی بۆ پاراستنا مروڤایەتیێ." },
        { title: "The Joker", rating: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", link: "https://www.youtube.com/embed/t433PEQGErc", desc: "چیرۆکا تاری یا ئارسەر فلێک." },
        { title: "Inception", rating: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/YoHD9XEInc0", desc: "دزینا نهێنیان دناڤ خەونان دا." },
        { title: "The Dark Knight", rating: "9.0", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/EXeTwQWrcwY", desc: "باتمان ڕووبەڕووی جۆکەری دبیتەڤە." },
        { title: "Avatar 2", rating: "7.6", poster: "https://m.media-amazon.com/images/M/MV5BYjhiNjBlODctY2ZiOC00YjVlLWFlNzAtNTVhNzM1YjI1NzMxXkEyXkFqcGdeQXVyMjQxNTE1MDA@._V1_.jpg", link: "https://www.youtube.com/embed/d9MyW72ELq0", desc: "گەشتەکا نوی د جیهانێ ئاڤێ دا." },
        { title: "John Wick 4", rating: "7.8", poster: "https://m.media-amazon.com/images/M/MV5BMDExZGMyOTMtMDgyYi00NGIwLWJhMTEtOTdkZGFjNmZiMTE2XkEyXkFqcGdeQXVyMTUzMTg2ODkz._V1_.jpg", link: "https://www.youtube.com/embed/qEVUrkHuJ8I", desc: "جۆن ویک تۆڵەی خۆ دەکاتەوە." },
        { title: "Oppenheimer", rating: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMDBmYTZjNjUtN2M1Zi00N2MzLTk5ZGYtMWUxY2FlZTgyMjYzXkEyXkFqcGdeQXVyMTUzMTg2ODkz._V1_.jpg", link: "https://www.youtube.com/embed/uYPbbksJxIg", desc: "چیرۆکا دروستکەری بۆمبا ئەتۆمی." },
        { title: "Spider-Man", rating: "8.2", poster: "https://m.media-amazon.com/images/M/MV5BZWMyYzFjYTYtNTRjYi00OGExLWE2YzgtOGRmYjAxZTU3NzBiXkEyXkFqcGdeQXVyMzQ0MzA0NTM@._V1_.jpg", link: "https://www.youtube.com/embed/JfVOs4VSpmA", desc: "سپایدەرمان دگەل مولتیڤێرسێ." },
        { title: "The Godfather", rating: "9.2", poster: "https://m.media-amazon.com/images/M/MV5BM2MyNjYxNmUtYTAwNi00MTYxLWJmNWYtYzZlODY3ZTk3OTFlXkEyXkFqcGdeQXVyNzkwMjQ5NzM@._V1_.jpg", link: "https://www.youtube.com/embed/UaVTIH8mujA", desc: "مەزنترین چیرۆکا مافیایێ." },
        { title: "The Shawshank", rating: "9.3", poster: "https://m.media-amazon.com/images/M/MV5BNDE3ODcxNzMtY2YzZC00NmNlLWJiNDMtZDViZWM2MzIxZDYwXkEyXkFqcGdeQXVyNjU0OTQ0OTY@._V1_.jpg", link: "https://www.youtube.com/embed/PLl99DgF6b4", desc: "ئومێد و ئازادی دناڤ زیندانێ دا." }
        // تو دشێی لێرە هەتا ۱۰۰ فیلمان زێدە بکەی...
    ];

    function renderMovies(data) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = data.map((m, index) => `
            <div class="card" onclick="openM(${index})">
                <img src="${m.poster}" loading="lazy">
                <div class="card-info">
                    <h3>${m.title}</h3>
                    <span style="color:var(--accent); font-size:12px;">⭐ ${m.rating}</span>
                </div>
            </div>
        `).join('');
    }

    function searchMovies() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
        renderMovies(filtered);
    }

    function openM(index) {
        const m = movies[index];
        document.getElementById('frame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mDesc').innerText = m.desc;
        document.getElementById('modal').style.display = 'block';
    }

    function closeM() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('frame').src = "";
    }

    renderMovies(movies);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Ultimate Visual Experience</title>
    <style>
        :root {
            --primary: #ffcc00;
            --secondary: #6366f1;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(-45deg, #050505, #121212, #000b18, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hero Section with Mesh Gradient */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
        }

        .logo-main {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .search-container {
            width: 80%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-container input {
            flex: 1;
            background: none;
            border: none;
            padding: 15px 25px;
            color: white;
            font-size: 18px;
            outline: none;
        }

        /* Movie Cards Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 35px;
            padding: 50px 8%;
        }

        .movie-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-15px) rotate(2deg);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255, 204, 0, 0.2);
        }

        .poster {
            width: 100%;
            height: 320px;
            object-fit: cover;
            transition: 0.5s;
        }

        .movie-card:hover .poster {
            filter: scale(1.1) brightness(0.7);
        }

        .rating {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary);
            color: black;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Video Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            width: 90%;
            max-width: 1100px;
            margin: 2% auto;
            background: #111;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .details-pane {
            padding: 30px;
            background: linear-gradient(to bottom, #111, #050505);
        }

        /* Glass Category Bar */
        .cat-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .cat-chip {
            padding: 8px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-chip:hover {
            background: var(--primary);
            color: black;
        }

    </style>
</head>
<body>

<div class="hero">
    <div class="logo-main">MOVIES<span>4U</span></div>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="render()" placeholder="ل تشتەکێ سەرنجڕاکێش بگەڕێ...">
    </div>
    <div class="cat-bar">
        <div class="cat-chip" onclick="filterCat('All')">هەمی</div>
        <div class="cat-chip" onclick="filterCat('Action')">ئەکشن</div>
        <div class="cat-chip" onclick="filterCat('Sci-Fi')">زانستی</div>
        <div class="cat-chip" onclick="filterCat('Animation')">کارتۆن</div>
    </div>
</div>

<div class="container" id="movieList"></div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeVideo()">✕</button>
        <iframe id="videoFrame" width="100%" height="500px" src="" frameborder="0" allowfullscreen></iframe>
        <div class="details-pane">
            <h1 id="mTitle" style="color: var(--primary); margin: 0;"></h1>
            <p id="mDesc" style="color: #ccc; line-height: 1.8; margin-top: 15px; font-size: 18px;"></p>
        </div>
    </div>
</div>

<script>
    const movies = [
        { id: 0, title: "Interstellar", cat: "Sci-Fi", rate: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", desc: "گەشتەکا پڕی مەترسی و جوانی دناڤ گەردوونێ بێ دووماهی دا بۆ دیتنا مالەکا نوی بۆ مرۆڤایەتیێ." },
        { id: 1, title: "Spider-Man", cat: "Action", rate: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMzI0NmVkMjEtYmY4MS00ZDMxLTlkZmEtMzU4MDQxYTMzMjU2XkEyXkFqcGdeQXVyMzQ0MzA0NTM@._V1_.jpg", link: "https://www.youtube.com/embed/shW9i6k8cB0", desc: "گەشتەکا نوی دناڤ جیهانێن جودا یێن سپایدەرمان دا." },
        { id: 2, title: "Dune 2", cat: "Sci-Fi", rate: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BN2QyZGU4ZDctOWMzMy00NTc5LThlOGQtODhmNDI1NmY5YzEzXkEyXkFqcGdeQXVyMTUzMTg2ODkz._V1_.jpg", link: "https://www.youtube.com/embed/Way9Dexny3w", desc: "جەنگ و تۆڵەسەندنەوە ل سەر لمێن هەسارەیا ئاراکیس." },
        { id: 3, title: "Lion King", cat: "Animation", rate: "8.5", poster: "https://m.media-amazon.com/images/M/MV5BMjIwMjE1Nzc4NV5BMl5BanBnXkFtZTgwNDg4OTA1NzM@._V1_.jpg", link: "https://www.youtube.com/embed/7TavVZKewr0", desc: "چیرۆکا کلاسیکی یا سیمبای دناڤ دارستانێ دا." }
    ];

    let filter = "All";

    function filterCat(c) {
        filter = c;
        render();
    }

    function render() {
        const list = document.getElementById('movieList');
        const s = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        movies.filter(m => (filter === "All" || m.cat === filter) && m.title.toLowerCase().includes(s)).forEach(m => {
            list.innerHTML += `
                <div class="movie-card" onclick="openVideo(${m.id})">
                    <div class="rating">⭐ ${m.rate}</div>
                    <img src="${m.poster}" class="poster">
                    <div style="padding:20px; text-align:center;">
                        <h3 style="margin:0; font-size:20px;">${m.title}</h3>
                        <p style="color:var(--primary); font-size:14px; margin-top:5px;">${m.cat}</p>
                    </div>
                </div>`;
        });
    }

    function openVideo(id) {
        const m = movies.find(x => x.id === id);
        document.getElementById('videoFrame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mDesc').innerText = m.desc;
        document.getElementById('videoModal').style.display = 'block';
    }

    function closeVideo() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('videoFrame').src = '';
    }

    render();
</script>
</body>
</html>

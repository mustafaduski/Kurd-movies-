<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Hybrid Pro</title>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; }
        
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; z-index: 1000;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #222; box-sizing: border-box;
        }

        .container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 20px; padding: 110px 5% 50px; 
        }

        .card { 
            background: #111; border-radius: 15px; overflow: hidden; transition: 0.4s; cursor: pointer; border: 1px solid #222;
            position: relative;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-info { padding: 12px; text-align: center; background: linear-gradient(transparent, #000); }

        .tag { position: absolute; top: 10px; right: 10px; background: var(--accent); color: black; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; }
        
        #status-bar { position: fixed; bottom: 10px; left: 10px; font-size: 12px; color: #555; z-index: 100; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 26px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <input type="text" id="search" placeholder="بگەڕێ..." style="padding: 10px 20px; border-radius: 25px; border: 1px solid #333; background: #111; color: white; width: 200px;" onkeyup="handleSearch()">
</nav>

<div id="status-bar">Connecting to Cloud...</div>

<div class="container" id="movieGrid">
    </div>

<script>
    // ١. لیستا فیلمێن بنەڕەتی (ئەڤە ب بێ ئینتەرنێت ژی کار دکەت)
    const localMovies = [
        { title: "Interstellar", rating: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" },
        { title: "The Joker", rating: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg" },
        { title: "Inception", rating: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg" },
        { title: "The Dark Knight", rating: "9.0", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg" },
        { title: "Avatar 2", rating: "7.6", poster: "https://m.media-amazon.com/images/M/MV5BYjhiNjBlODctY2ZiOC00YjVlLWFlNzAtNTVhNzM1YjI1NzMxXkEyXkFqcGdeQXVyMjQxNTE1MDA@._V1_.jpg" },
        { title: "John Wick 4", rating: "7.8", poster: "https://m.media-amazon.com/images/M/MV5BMDExZGMyOTMtMDgyYi00NGIwLWJhMTEtOTdkZGFjNmZiMTE2XkEyXkFqcGdeQXVyMTUzMTg2ODkz._V1_.jpg" },
        { title: "Spider-Man", rating: "8.2", poster: "https://m.media-amazon.com/images/M/MV5BZWMyYzFjYTYtNTRjYi00OGExLWE2YzgtOGRmYjAxZTU3NzBiXkEyXkFqcGdeQXVyMzQ0MzA0NTM@._V1_.jpg" },
        { title: "Titanic", rating: "7.9", poster: "https://m.media-amazon.com/images/M/MV5BMDdmZGU3NDQtY2E5My00ZTliLWIzOTUtOTU4Zjg3YjdiN2MwXkEyXkFqcGdeQXVyNTAyODkwOQ@@._V1_.jpg" }
    ];

    const API_KEY = '82650220645068a8cf72d421d234a413';
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
    const grid = document.getElementById('movieGrid');
    const status = document.getElementById('status-bar');

    // ٢. فەنکشنا نیشاندانا فیلمی
    function displayMovies(movies, isLive = false) {
        if(!isLive) grid.innerHTML = ''; // پاقژکرن بۆ جارا ئێکێ
        movies.forEach(m => {
            const card = document.createElement('div');
            card.className = 'card';
            const imgUrl = isLive ? (m.poster_path ? IMG_PATH + m.poster_path : 'https://via.placeholder.com/500') : m.poster;
            card.innerHTML = `
                ${isLive ? '<div class="tag">LIVE</div>' : '<div class="tag" style="background:#555">OFFLINE</div>'}
                <img src="${imgUrl}" alt="${m.title}">
                <div class="card-info">
                    <h3 style="font-size:14px; margin:0;">${m.title}</h3>
                    <span style="color:var(--accent)">⭐ ${m.vote_average || m.rating}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ٣. هەوڵدان بۆ ئینانا داتایێن LIVE
    async function tryLiveUpdates() {
        try {
            const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc`);
            if(!res.ok) throw new Error();
            const data = await res.json();
            grid.innerHTML = ''; // ئەگەر API کار کر، فیلمێن ئۆفلاین لادە و یێن خێرا دابنێ
            displayMovies(data.results, true);
            status.innerText = "Connected to Live Database ✅";
            status.style.color = "#4CAF50";
        } catch (err) {
            status.innerText = "Using Local Database (Offline Mode) ⚠️";
        }
    }

    // ٤. گەڕیان
    async function handleSearch() {
        const term = document.getElementById('search').value;
        if(term.length > 2) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${term}`);
                const data = await res.json();
                grid.innerHTML = '';
                displayMovies(data.results, true);
            } catch (e) { console.log("Search failed, offline mode."); }
        }
    }

    // ل دەسپێکێ فیلمێن ئۆفلاین نیشان بدە (دا سایت ڕەش نەبیت)
    displayMovies(localMovies);
    
    // پاشان هەوڵ بدە داتایێن نوو ئۆتۆماتیکی بئینیت
    setTimeout(tryLiveUpdates, 1500);

</script>
</body>
</html>

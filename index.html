<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U Pro | Glassmorphism</title>
    <style>
        :root {
            --accent: #ffcc00;
            --glass: rgba(255, 255, 255, 0.05);
            --blur: blur(15px);
            --grad: linear-gradient(135deg, #1a1a2e 0%, #050505 100%);
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--grad); color: white;
            min-height: 100vh; overflow-x: hidden;
        }

        /* Navbar - Ultra Glass */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; z-index: 1000;
            background: rgba(0,0,0,0.6); backdrop-filter: var(--blur);
            border-bottom: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;
        }

        .logo { font-size: 28px; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(255,204,0,0.5); }

        .search-box {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 30px; color: white; width: 250px;
            transition: 0.4s; backdrop-filter: var(--blur); outline: none;
        }
        .search-box:focus { width: 320px; border-color: var(--accent); box-shadow: 0 0 20px rgba(255,204,0,0.2); }

        /* Watchlist Button */
        .watchlist-btn-nav {
            background: var(--accent); color: black; border: none; padding: 8px 15px;
            border-radius: 20px; cursor: pointer; font-weight: bold; margin-right: 10px;
        }

        /* Container */
        .container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px; padding: 120px 5% 50px;
        }

        /* Pro Movie Card */
        .card {
            background: var(--glass); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.5s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative; cursor: pointer;
        }
        .card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .card img { width: 100%; height: 280px; object-fit: cover; transition: 0.5s; }
        .card:hover img { filter: brightness(0.4); }

        .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transition: 0.5s; padding: 15px; text-align: center;
        }
        .card:hover .card-overlay { opacity: 1; }

        .add-fav {
            background: var(--accent); border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-size: 20px; margin-bottom: 10px;
        }

        /* Modal Player */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 5000;
        }
        .modal-content { width: 90%; max-width: 1100px; margin: 5vh auto; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .video-wrapper { position: relative; padding-top: 56.25%; border-radius: 25px; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,1); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .close-btn { position: fixed; top: 25px; left: 25px; background: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; z-index: 6000; }

        @media (max-width: 600px) { .container { grid-template-columns: 1fr 1fr; } .search-box { width: 120px; } }
    </style>
</head>
<body>

<nav>
    <div class="logo">MOVIES4U</div>
    <div style="display: flex; align-items: center;">
        <button class="watchlist-btn-nav" onclick="showWatchlist()">لیستا من ❤️</button>
        <input type="text" id="searchInput" class="search-box" placeholder="بگەڕێ..." onkeyup="searchMovies()">
    </div>
</nav>

<div class="container" id="movieGrid"></div>

<div id="modal" class="modal">
    <button class="close-btn" onclick="closeM()">✕</button>
    <div class="modal-content">
        <div class="video-wrapper"><iframe id="frame" src="" frameborder="0" allowfullscreen></iframe></div>
        <h1 id="mTitle" style="color: var(--accent); margin-top: 25px;"></h1>
        <p id="mDesc" style="color: #ccc; line-height: 1.8;"></p>
    </div>
</div>

<script>
    const movies = [
        { id: 1, title: "Interstellar", rating: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", desc: "گەشتەکا گەردوونی بۆ پاراستنا مروڤایەتیێ." },
        { id: 2, title: "The Joker", rating: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", link: "https://www.youtube.com/embed/t433PEQGErc", desc: "چیرۆکا تاری یا ئارسەر فلێک." },
        { id: 3, title: "Inception", rating: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/YoHD9XEInc0", desc: "دزینا نهێنیان دناڤ خەونان دا." },
        { id: 4, title: "The Dark Knight", rating: "9.0", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/EXeTwQWrcwY", desc: "باتمان دژی جۆکەری." },
        { id: 5, title: "Avatar 2", rating: "7.6", poster: "https://m.media-amazon.com/images/M/MV5BYjhiNjBlODctY2ZiOC00YjVlLWFlNzAtNTVhNzM1YjI1NzMxXkEyXkFqcGdeQXVyMjQxNTE1MDA@._V1_.jpg", link: "https://www.youtube.com/embed/d9MyW72ELq0", desc: "جیهانەکا ئاڤی یا جودا." }
        // ... (دشێی لیستا ١٠٠ فیلمـان لێرە تەمام بکەی)
    ];

    let watchlist = JSON.parse(localStorage.getItem('myWatchlist')) || [];

    function renderMovies(data) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = data.map(m => `
            <div class="card">
                <img src="${m.poster}" onclick="openM(${m.id})">
                <div class="card-overlay" onclick="openM(${m.id})">
                    <button class="add-fav" onclick="event.stopPropagation(); toggleWatchlist(${m.id})">
                        ${watchlist.includes(m.id) ? '❤️' : '🤍'}
                    </button>
                    <h3>${m.title}</h3>
                    <span style="color:var(--accent)">⭐ ${m.rating}</span>
                </div>
            </div>
        `).join('');
    }

    function toggleWatchlist(id) {
        if(watchlist.includes(id)) {
            watchlist = watchlist.filter(x => x !== id);
        } else {
            watchlist.push(id);
        }
        localStorage.setItem('myWatchlist', JSON.stringify(watchlist));
        renderMovies(movies);
    }

    function showWatchlist() {
        const filtered = movies.filter(m => watchlist.includes(m.id));
        renderMovies(filtered);
    }

    function searchMovies() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = movies.filter(m => m.title.toLowerCase().includes(term));
        renderMovies(filtered);
    }

    function openM(id) {
        const m = movies.find(x => x.id === id);
        document.getElementById('frame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mDesc').innerText = m.desc;
        document.getElementById('modal').style.display = 'block';
    }

    function closeM() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('frame').src = "";
    }

    renderMovies(movies);
</script>
</body>
</html>

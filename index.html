<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Dynamic Experience</title>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --glass: rgba(255, 255, 255, 0.1); }
        
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: white; overflow-x: hidden;
        }

        /* 1. Dynamic Hero Section */
        .hero {
            height: 80vh; width: 100%; position: relative;
            display: flex; align-items: center; padding: 0 5%;
            overflow: hidden;
        }
        .hero-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.4);
        }
        .hero-content { max-width: 600px; z-index: 10; animation: fadeInUp 1s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 2. Neon Glass Navbar */
        nav {
            position: fixed; top: 0; width: 90%; margin: 0 5%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; z-index: 1000; border-bottom: 1px solid var(--glass);
            backdrop-filter: blur(10px);
        }

        /* 3. Horizontal Trending Row */
        .section-title { padding: 40px 5% 10px; font-size: 24px; border-right: 4px solid var(--accent); margin-right: 5%; }
        
        .scrolling-wrapper {
            display: flex; gap: 20px; overflow-x: auto; padding: 20px 5%;
            scroll-behavior: smooth; scrollbar-width: none;
        }
        .scrolling-wrapper::-webkit-scrollbar { display: none; }

        /* 4. Dynamic Cards */
        .card {
            min-width: 220px; height: 330px; border-radius: 20px;
            position: relative; overflow: hidden; transition: 0.5s;
            cursor: pointer; border: 1px solid var(--glass);
        }
        .card:hover { 
            transform: scale(1.1) z-index: 100; 
            border-color: var(--accent); 
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info {
            position: absolute; bottom: 0; width: 100%; padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            transform: translateY(50px); transition: 0.4s; opacity: 0;
        }
        .card:hover .card-info { transform: translateY(0); opacity: 1; }

        /* 5. Mood Switcher (Floating) */
        .mood-box {
            position: fixed; bottom: 30px; right: 30px; z-index: 100;
            background: var(--accent); color: black; padding: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Modal View */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; }
        .m-content { width: 90%; max-width: 1000px; margin: 5vh auto; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 28px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <div style="display: flex; gap: 20px;">
        <span>فیلم</span>
        <span>زنجیرە</span>
        <span>دۆبلاج</span>
    </div>
</nav>

<div class="hero">
    <video class="hero-video" autoplay muted loop>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-space-background-with-stars-and-nebula-41004-large.mp4" type="video/mp4">
    </video>
    <div class="hero-content">
        <h1 style="font-size: 50px; margin: 0;">INTERSTELLAR</h1>
        <p style="font-size: 18px; color: #ccc;">گەشتەکا پڕی مەترسی و جوانی دناڤ کونێن ڕەش دا بۆ ڕزگارکرنا مرۆڤایەتیێ.</p>
        <button onclick="openM(0)" style="padding: 12px 30px; background: var(--accent); border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">نوکە تەماشە بکە</button>
    </div>
</div>

<h2 class="section-title">🔥 تڕێندێن ڤێ حەفتیێ</h2>
<div class="scrolling-wrapper" id="trending"></div>

<h2 class="section-title">🍿 نووترین فیلم</h2>
<div class="scrolling-wrapper" id="newest"></div>

<div class="mood-box" onclick="alert('سایت دێ هێتە گوهۆڕین بۆ میزاجێ تە! ✨')">🎭 میزاجێ تە؟</div>

<div id="modal" class="modal">
    <div class="m-content">
        <button onclick="closeM()" style="float: left; color: white; background: none; border: none; font-size: 30px; cursor: pointer;">✕</button>
        <iframe id="frame" width="100%" height="550px" src="" frameborder="0" allowfullscreen style="border-radius: 20px; box-shadow: 0 0 50px var(--accent);"></iframe>
    </div>
</div>

<script>
    const movies = [
        { id: 0, title: "Interstellar", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E" },
        { id: 1, title: "Joker", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", link: "https://www.youtube.com/embed/t433PEQGErc" },
        { id: 2, title: "The Dark Knight", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/EXeTwQWrcwY" },
        { id: 3, title: "Avatar 2", poster: "https://m.media-amazon.com/images/M/MV5BYjhiNjBlODctY2ZiOC00YjVlLWFlNzAtNTVhNzM1YjI1NzMxXkEyXkFqcGdeQXVyMjQxNTE1MDA@._V1_.jpg", link: "https://www.youtube.com/embed/d9MyW72ELq0" },
        { id: 4, title: "Inception", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/YoHD9XEInc0" }
    ];

    function render() {
        const trend = document.getElementById('trending');
        const news = document.getElementById('newest');
        
        const html = movies.map(m => `
            <div class="card" onclick="openM(${m.id})">
                <img src="${m.poster}">
                <div class="card-info">
                    <h4>${m.title}</h4>
                    <small>⭐ 8.9</small>
                </div>
            </div>
        `).join('');

        trend.innerHTML = html;
        news.innerHTML = html;
    }

    function openM(id) {
        document.getElementById('frame').src = movies[id].link;
        document.getElementById('modal').style.display = 'block';
    }

    function closeM() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('frame').src = "";
    }

    render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کوردی سینەما - لێگەریان</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: white;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        /* ستایلێ لێگەریانێ */
        .search-container {
            margin: 20px auto;
            text-align: center;
        }
        #searchInput {
            padding: 12px;
            width: 60%;
            max-width: 400px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
            background-color: #333;
            color: white;
            padding-right: 20px;
        }
        #searchInput:focus {
            border: 1px solid #e50914;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .movie-card {
            background-color: #222;
            margin: 15px;
            width: 200px;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid #333;
        }
        /* ئەڤە بۆ ڤەشارتنا فیلمێن نەخواستی دەمێ لێگەریانێ */
        .hidden {
            display: none !important;
        }

        .movie-card:hover {
            transform: scale(1.05);
            border-color: #e50914;
        }
        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .movie-info {
            padding: 10px;
            text-align: center;
        }
        .btn-watch {
            display: inline-block;
            padding: 8px 15px;
            background-color: #e50914;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>سینەما ب کوردی</h1>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchMovie()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    </div>
</header>

<div class="container" id="movieList">
    
    <div class="movie-card">
        <img src="https://via.placeholder.com/200x280?text=Batman" alt="Batman">
        <div class="movie-info">
            <h3 class="title">باتمان</h3>
            <a href="#" class="btn-watch">تەماشە بکە</a>
        </div>
    </div>

    <div class="movie-card">
        <img src="https://via.placeholder.com/200x280?text=Spiderman" alt="Spiderman">
        <div class="movie-info">
            <h3 class="title">سپایدەرمان</h3>
            <a href="#" class="btn-watch">تەماشە بکە</a>
        </div>
    </div>

    <div class="movie-card">
        <img src="https://via.placeholder.com/200x280?text=Avatar" alt="Avatar">
        <div class="movie-info">
            <h3 class="title">ئاڤاتار</h3>
            <a href="#" class="btn-watch">تەماشە بکە</a>
        </div>
    </div>

</div>

<script>
    function searchMovie() {
        // وەرگرتنا نڤیسینا ناڤ باکسا لێگەریانێ
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('movie-card');
        
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].querySelector('.title').innerText.toLowerCase();
            
            // ئەگەر ناڤێ فیلمی تێدا بیت، نیشان بدە، ئەگەر نە ڤەشێرە
            if (title.includes(input)) {
                cards[i].classList.remove('hidden');
            } else {
                cards[i].classList.add('hidden');
            }
        }
    }
</script>

</body>
</html>

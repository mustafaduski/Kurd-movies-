<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | The Ultimate Cinema</title>
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --card: #121317; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.5s; }

        /* Navbar & Tools */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #000; position: sticky; top: 0; z-index: 1000; }
        .nav-btns { display: flex; gap: 10px; }
        .btn-surprise { background: linear-gradient(45deg, #ffcc00, #ff8800); border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; animation: glow 2s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 5px var(--accent); } 50% { box-shadow: 0 0 20px var(--accent); } 100% { box-shadow: 0 0 5px var(--accent); } }

        /* Movie Grid */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; padding: 40px 5%; }
        .movie-card { background: var(--card); border-radius: 18px; overflow: hidden; cursor: pointer; transition: 0.4s; border: 1px solid #222; position: relative; }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .poster { width: 100%; height: 320px; object-fit: cover; }

        /* Modal & Cinema Mode */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; overflow-y: auto; }
        .video-container { position: relative; width: 90%; max-width: 1000px; margin: 50px auto; border-radius: 20px; overflow: hidden; box-shadow: 0 0 100px rgba(255, 204, 0, 0.2); }
        .ambient-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; filter: blur(80px); opacity: 0.4; z-index: -1; background: var(--accent); transition: 1s; }
        
        /* Rating Stars */
        .rating-stars { color: #555; font-size: 25px; margin: 10px 0; }
        .star { cursor: pointer; transition: 0.2s; }
        .star.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* Download Button */
        .download-btn { background: #1a1a1a; color: white; border: 1px solid #333; padding: 12px 25px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-top: 15px; }
        .download-btn:hover { background: #222; border-color: #00ff88; color: #00ff88; }

        .close-m { position: fixed; top: 20px; left: 20px; background: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; z-index: 3000; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 26px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <div class="nav-btns">
        <button class="btn-surprise" onclick="surpriseMe()">🎲 من سەرسام بکە</button>
    </div>
</nav>

<div class="container" id="grid"></div>

<div id="modal" class="modal">
    <button class="close-m" onclick="closeM()">✕</button>
    <div class="video-container">
        <div id="glow" class="ambient-glow"></div>
        <iframe id="frame" width="100%" height="500px" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <div style="max-width: 1000px; margin: 0 auto; padding: 0 20px 50px;">
        <h1 id="mTitle" style="color: var(--accent); margin-bottom: 5px;"></h1>
        <div class="rating-stars" id="rating">
            <span class="star" onclick="rate(1)">★</span>
            <span class="star" onclick="rate(2)">★</span>
            <span class="star" onclick="rate(3)">★</span>
            <span class="star" onclick="rate(4)">★</span>
            <span class="star" onclick="rate(5)">★</span>
        </div>
        <p id="mDesc" style="line-height: 1.8; color: #ccc; font-size: 18px;"></p>
        
        <button class="download-btn" onclick="alert('داونلۆد دەستپێکر... 📥')">
            <span>⬇️ داونلۆد ب کوالێتیا 4K</span>
        </button>

        <div style="margin-top: 40px; background: #111; padding: 25px; border-radius: 15px;">
            <h3>💬 ڕایێن بینەران</h3>
            <textarea id="opInput" style="width:100%; background:#000; border:1px solid #333; color:white; padding:15px; border-radius:10px;" rows="2" placeholder="چیرۆکا ڤی فیلمی چەوا بوو؟"></textarea>
            <button onclick="addOp()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:5px; margin-top:10px; font-weight:bold; cursor:pointer;">پۆست بکە</button>
            <div id="opList" style="margin-top:20px;"></div>
        </div>
    </div>
</div>

<script>
    const movies = [
        { id: 0, title: "Interstellar", desc: "گەشتەکا مەزن دناڤ گەردوونێ بێ دووماهی دا.", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", ops: [] },
        { id: 1, title: "Inception", desc: "دزینا نهێنیان دناڤ خەونێن خەلکی دا.", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/YoHD9XEInc0", ops: [] },
        { id: 2, title: "The Dark Knight", desc: "باتمان ڕووبەڕووی مەزنترین دۆژمن دبیتەڤە.", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/EXeTwQWrcwY", ops: [] }
    ];

    let currentId = null;

    function render() {
        document.getElementById('grid').innerHTML = movies.map(m => `
            <div class="movie-card" onclick="openM(${m.id})">
                <img src="${m.poster}" class="poster">
                <div style="padding:15px; text-align:center;"><h3>${m.title}</h3></div>
            </div>
        `).join('');
    }

    function openM(id) {
        currentId = id;
        const m = movies.find(x => x.id === id);
        document.getElementById('frame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mDesc').innerText = m.desc;
        document.getElementById('modal').style.display = 'block';
        loadOps();
        rate(0); // Reset stars
    }

    function surpriseMe() {
        const randomId = Math.floor(Math.random() * movies.length);
        openM(randomId);
    }

    function rate(n) {
        const stars = document.querySelectorAll('.star');
        stars.forEach((s, i) => s.classList.toggle('active', i < n));
    }

    function addOp() {
        const val = document.getElementById('opInput').value;
        if(!val) return;
        movies.find(x => x.id === currentId).ops.unshift(val);
        document.getElementById('opInput').value = "";
        loadOps();
    }

    function loadOps() {
        const ops = movies.find(x => x.id === currentId).ops;
        document.getElementById('opList').innerHTML = ops.map(o => `<div style="background:#1a1a1a; padding:10px; border-radius:8px; margin-bottom:10px;">👤 ${o}</div>`).join('');
    }

    function closeM() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('frame').src = "";
    }

    render();
</script>
</body>
</html>

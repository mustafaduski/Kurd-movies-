<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | Premium Kurdish Cinema</title>
    <style>
        :root {
            --accent: #ffcc00;
            --bg: #08090a;
            --card-bg: #111418;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Hero Section with Video */
        .hero-section {
            position: relative;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        #bgVideo {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: brightness(35%);
        }

        .hero-content { z-index: 1; width: 100%; }
        .logo { font-size: 55px; font-weight: 900; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .search-box {
            width: 85%; max-width: 550px; padding: 15px 30px;
            border-radius: 40px; border: 2px solid var(--accent);
            background: rgba(0,0,0,0.7); color: white;
            font-size: 18px; backdrop-filter: blur(10px); outline: none;
        }

        /* Movie Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px; padding: 50px 5%;
        }

        /* Scroll Animation Styles */
        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222;
            cursor: pointer;
            position: relative;
            opacity: 0; /* دەسپێکێ ڤەشارتییە */
            transform: translateY(40px);
            transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .movie-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .movie-card:hover { transform: scale(1.05); border-color: var(--accent); z-index: 10; }
        .poster { width: 100%; height: 320px; object-fit: cover; }
        .rating-tag { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.85); color: var(--accent); padding: 5px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .info { padding: 15px; text-align: center; }

        /* Modal Player */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 9999; overflow-y: auto; }
        .modal-content { width: 95%; max-width: 1100px; margin: 40px auto; background: #111; border-radius: 20px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,1); }
        iframe { width: 100%; aspect-ratio: 16/9; border-radius: 20px 20px 0 0; border: none; }
        .details-box { padding: 30px; text-align: right; }
        .related-box { padding: 25px; background: #080808; border-top: 1px solid #222; }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-top: 20px; }
        .close-btn { position: absolute; top: -50px; right: 0; background: var(--accent); border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }

        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr 1fr; gap: 15px; }
            .logo { font-size: 35px; }
            .hero-section { height: 350px; }
        }
    </style>
</head>
<body>

<div class="hero-section">
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-clapperboard-and-film-reels-in-dark-studio-34538-large.mp4" type="video/mp4">
    </video>
    <div class="hero-content">
        <div class="logo">Movies<span>4U</span></div>
        <input type="text" id="searchInp" class="search-box" onkeyup="render()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    </div>
</div>

<div class="container" id="movieList"></div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeVideo()">✕ داخستن</button>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
        <div class="details-box">
            <h1 id="mTitle" style="color: var(--accent); margin: 0 0 10px 0;"></h1>
            <p id="mMeta" style="color: #aaa; font-size: 14px; margin-bottom: 20px;"></p>
            <p id="mDesc" style="line-height: 1.8; font-size: 17px; color: #ddd;"></p>
        </div>
        <div class="related-box">
            <h3 style="border-right: 4px solid var(--accent); padding-right: 12px;">فیلمێن نێزیک</h3>
            <div id="relatedGrid" class="related-grid"></div>
        </div>
    </div>
</div>

<script>
    const movies = [
        { id: 0, title: "Interstellar", cat: "زانستی", year: "2014", rate: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", link: "https://www.youtube.com/embed/zSWdZVtXT7E", desc: "گەشتەکا پڕی مەترسی دناڤ کونێن ڕەش دا بۆ قورتالکرنا مرۆڤایەتیێ پشتی زەوی تووشی قەیرانەکا مەزن دبیت." },
        { id: 1, title: "The Dark Knight", cat: "ئەکشن", year: "2008", rate: "9.0", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/EXeTwQWrcwY", desc: "باتمان ڕووبەڕووی مەزنترین دوژمنێ خۆ دبیتەوە کو جۆکەرە، یێ کو هەوڵ ددەت باژێڕێ گۆتام بەرەو وێرانبوونێ ببەت." },
        { id: 2, title: "The Lion King", cat: "ئەنیمەیشن", year: "1994", rate: "8.5", poster: "https://m.media-amazon.com/images/M/MV5BYTYxNGMyZTYtMjE3MS00MzNjLWFjNmYtMDk3N2FmM2JiM2M1XkEyXkFqcGdeQXVyNjY5NDU4NzI@._V1_.jpg", link: "https://www.youtube.com/embed/lFzVJEksoDY", desc: "چیرۆکا شێرەکی گەنج بناڤێ سیمبا کو پشتی مرنا بابێ خۆ دهێتە دوورخستن، پاشان دزڤریتەڤە بۆ وەرگرتنا تەختی." },
        { id: 3, title: "Inception", cat: "زانستی", year: "2010", rate: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg", link: "https://www.youtube.com/embed/YoHD9XEInc0", desc: "دزەکێ بلیمەت د ناڤ خەونێن خەلکی دا نهێنیان ددزیت، بەلێ ئەڤ جارە ئەرکێ وی چاندنا بیرۆکەیەکە." },
        { id: 4, title: "Joker", cat: "دراما", year: "2019", rate: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", link: "https://www.youtube.com/embed/t433PEQGErc", desc: "چیرۆکا ئارتەر فلێک، کۆمیدیانەکێ شکەستی کو ل ژێر فشارێن جڤاکی دا بەرەو شێتی و تاوانێ دچیت." },
        { id: 5, title: "Spider-Man", cat: "ئەکشن", year: "2021", rate: "8.2", poster: "https://m.media-amazon.com/images/M/MV5BZWMyYzFjYTYtNTRjYi00OGExLWE2YzgtOGRmYjAxZTU3NzBiXkEyXkFqcGdeQXVyMzQ0MzA0NTM@._V1_.jpg", link: "https://www.youtube.com/embed/JfVOs4VSpmA", desc: "پشتی ناسنامەیا وی دهێتە ئاشکراکرن، پیتەر پارکەر داخوازا هاریکاریێ ژ دکتۆر سترەینج دکەت." }
    ];

    function render() {
        const list = document.getElementById('movieList');
        const search = document.getElementById('searchInp').value.toLowerCase();
        list.innerHTML = '';

        movies.filter(m => m.title.toLowerCase().includes(search)).forEach(m => {
            list.innerHTML += `
                <div class="movie-card" onclick="openVideo(${m.id})">
                    <span class="rating-tag">⭐ ${m.rate}</span>
                    <img src="${m.poster}" class="poster">
                    <div class="info">
                        <h3>${m.title}</h3>
                        <p>${m.year} • ${m.cat}</p>
                    </div>
                </div>`;
        });
        setTimeout(reveal, 100);
    }

    // Scroll Reveal Logic
    function reveal() {
        const cards = document.querySelectorAll(".movie-card");
        cards.forEach(card => {
            const cardTop = card.getBoundingClientRect().top;
            if (cardTop < window.innerHeight - 50) card.classList.add("show");
        });
    }

    function openVideo(id) {
        const m = movies.find(x => x.id === id);
        document.getElementById('videoFrame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mMeta').innerText = `${m.year} • ${m.cat} • IMDb ${m.rate}`;
        document.getElementById('mDesc').innerText = m.desc;

        // Related Movies Logic
        const grid = document.getElementById('relatedGrid');
        grid.innerHTML = '';
        movies.filter(x => x.cat === m.cat && x.id !== m.id).forEach(r => {
            grid.innerHTML += `
                <div onclick="openVideo(${r.id})" style="cursor:pointer; text-align:center;">
                    <img src="${r.poster}" style="width:100%; height:180px; object-fit:cover; border-radius:10px; border:1px solid #333;">
                    <p style="font-size:12px; margin-top:8px;">${r.title}</p>
                </div>`;
        });

        document.getElementById('videoModal').style.display = 'block';
        document.getElementById('videoModal').scrollTo(0,0);
    }

    function closeVideo() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('videoFrame').src = '';
    }

    window.addEventListener("scroll", reveal);
    render();
</script>
</body>
</html>

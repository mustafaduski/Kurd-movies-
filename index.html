<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U Kurdish | سینەما ب کوردی</title>
    <style>
        :root {
            --accent: #ffcc00;
            --bg: #08090a;
            --card-bg: #111418;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            background: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 100%);
            padding: 20px 5%;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 35px;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .search-box {
            width: 90%;
            max-width: 500px;
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 204, 0, 0.2); }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 8px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: black;
            border-color: var(--accent);
        }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            padding: 30px 5%;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s ease;
            border: 1px solid #222;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .poster-container { position: relative; height: 320px; }
        .poster { width: 100%; height: 100%; object-fit: cover; }

        .rating-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .info { padding: 15px; text-align: center; }
        .info h3 { margin: 0 0 8px; font-size: 18px; color: #fff; }
        .info p { font-size: 14px; color: #999; margin-bottom: 15px; }

        .watch-btn {
            display: block;
            background: var(--accent);
            color: black;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            width: 100%;
        }

        .watch-btn:hover { background: #e6b800; transform: scale(1.02); }

        /* Video Modal (Player) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal-content { width: 90%; max-width: 900px; position: relative; }
        .close-btn {
            position: absolute;
            top: -50px; right: 0;
            background: var(--accent);
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        iframe { width: 100%; aspect-ratio: 16/9; border: 2px solid var(--accent); border-radius: 10px; }

        .hidden { display: none; }

        @media (max-width: 600px) {
            .movie-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .poster-container { height: 240px; }
            .logo { font-size: 25px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Movies<span>4U</span></div>
    <input type="text" id="searchInput" class="search-box" onkeyup="filterMovies()" placeholder="ل ناڤێ فیلمی بگەڕێ...">
    
    <div class="filter-container">
        <button class="filter-btn active" onclick="setCategory('all', this)">هەمی</button>
        <button class="filter-btn" onclick="setCategory('Action', this)">ئەکشن</button>
        <button class="filter-btn" onclick="setCategory('Drama', this)">دراما</button>
        <button class="filter-btn" onclick="setCategory('Animation', this)">کارتۆن</button>
    </div>
</header>

<div class="movie-grid" id="movieList">
    </div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeVideo()">داخستن ✕</button>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<script>
    // لێرە دشێی فیلمێن خۆ زێدە بکەی
    let movies = [
        {
            title: "Interstellar",
            category: "Drama",
            year: "2014",
            rating: "8.7",
            poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg",
            link: "https://www.youtube.com/embed/zSWdZVtXT7E"
        },
        {
            title: "John Wick",
            category: "Action",
            year: "2014",
            rating: "7.4",
            poster: "https://m.media-amazon.com/images/M/MV5BMTU2NjA1ODgzMF5BMl5BanBnXkFtZTgwMTM2MTI4MjE@._V1_.jpg",
            link: "https://www.youtube.com/embed/2AUmvWm5P2I"
        },
        {
            title: "Spider-Man",
            category: "Action",
            year: "2021",
            rating: "8.2",
            poster: "https://m.media-amazon.com/images/M/MV5BZWMyYzFjYTYtNTRjYi00OGExLWE2YzgtOGRmYjAxZTU3NzBiXkEyXkFqcGdeQXVyMzQ0MzA0NTM@._V1_.jpg",
            link: "https://www.youtube.com/embed/JfVOs4VSpmA"
        },
        {
            title: "The Lion King",
            category: "Animation",
            year: "1994",
            rating: "8.5",
            poster: "https://m.media-amazon.com/images/M/MV5BYTYxNGMyZTYtMjE3MS00MzNjLWFjNmYtMDk3N2FmM2JiM2M1XkEyXkFqcGdeQXVyNjY5NDU4NzI@._V1_.jpg",
            link: "https://www.youtube.com/embed/lFzVJEksoDY"
        }
    ];

    let currentCat = 'all';

    function setCategory(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterMovies();
    }

    function filterMovies() {
        const container = document.getElementById('movieList');
        const search = document.getElementById('searchInput').value.toLowerCase();
        container.innerHTML = '';

        movies.forEach(m => {
            const matchesSearch = m.title.toLowerCase().includes(search);
            const matchesCat = (currentCat === 'all' || m.category === currentCat);

            if (matchesSearch && matchesCat) {
                container.innerHTML += `
                    <div class="movie-card">
                        <div class="poster-container">
                            <span class="rating-tag">⭐ ${m.rating}</span>
                            <img src="${m.poster}" class="poster">
                        </div>
                        <div class="info">
                            <h3>${m.title}</h3>
                            <p>${m.year} • ${m.category}</p>
                            <button class="watch-btn" onclick="openVideo('${m.link}')">▶ تەماشە بکە</button>
                        </div>
                    </div>
                `;
            }
        });
    }

    function openVideo(url) {
        const modal = document.getElementById('videoModal');
        const frame = document.getElementById('videoFrame');
        if(url && url !== "#") {
            frame.src = url;
            modal.style.display = 'flex';
        } else {
            alert("بوورە، ڤیدیۆ بەردەست نینە!");
        }
    }

    function closeVideo() {
        const modal = document.getElementById('videoModal');
        const frame = document.getElementById('videoFrame');
        frame.src = "";
        modal.style.display = 'none';
    }

    // دەستپێکرنا نیشاندانا فیلمـان
    filterMovies();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | The Ultimate Galaxy Cinema</title>
    <style>
        :root { --accent: #ffcc00; --glass: rgba(0, 0, 0, 0.7); --border: rgba(255, 204, 0, 0.3); }
        
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=2000&q=80');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: white; overflow-x: hidden;
        }

        /* Glassmorphism Navigation */
        nav {
            position: fixed; top: 0; width: 100%; 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; z-index: 1000; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
            box-sizing: border-box;
        }

        .points-badge { background: var(--accent); color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; }

        /* Hero Section */
        .hero {
            height: 70vh; display: flex; align-items: center; padding: 0 8%;
            background: linear-gradient(to right, rgba(0,0,0,0.8), transparent);
            margin-top: 60px;
        }
        .hero-content { max-width: 600px; }
        .btn-play { padding: 12px 35px; background: var(--accent); border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn-play:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent); }

        /* Dynamic Horizontal Lists */
        .section-title { padding: 40px 8% 10px; font-size: 24px; color: var(--accent); text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        
        .movie-row {
            display: flex; gap: 20px; overflow-x: auto; padding: 20px 8%;
            scrollbar-width: none;
        }
        .movie-row::-webkit-scrollbar { display: none; }

        /* Modern Movie Card */
        .card {
            min-width: 200px; height: 300px; border-radius: 15px;
            position: relative; overflow: hidden; transition: 0.5s;
            cursor: pointer; border: 1px solid var(--border);
            background: var(--glass);
        }
        .card:hover { transform: scale(1.1) translateY(-10px); z-index: 10; border-color: var(--accent); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info {
            position: absolute; bottom: 0; width: 100%; padding: 15px;
            background: linear-gradient(transparent, black);
            opacity: 0; transition: 0.3s;
        }
        .card:hover .card-info { opacity: 1; }

        /* Mood Floating Button */
        .mood-btn {
            position: fixed; bottom: 30px; left: 30px; z-index: 100;
            background: var(--accent); color: black; padding: 15px 25px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Immersive Player Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 5000; overflow-y: auto; }
        .modal-body { width: 90%; max-width: 1100px; margin: 50px auto; }
        .video-box { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 0 50px rgba(255,204,0,0.3); }
        
        .cast-list { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .cast-item { text-align: center; min-width: 80px; }
        .cast-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }

        .opinion-section { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; margin-top: 20px; }
        textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; }

        .close-x { font-size: 30px; color: white; background: none; border: none; cursor: pointer; float: left; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 28px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <div class="points-badge">⭐ <span id="pts">0</span> Points</div>
</nav>

<div class="hero">
    <div class="hero-content">
        <h1 style="font-size: 50px; margin: 0;">INTERSTELLAR</h1>
        <p style="font-size: 18px; color: #ddd; margin: 20px 0;">گەشتەکا پڕی هەست و خەیال دناڤ کونێن ڕەش دا بۆ دیتنا مالەکا نوی بۆ مروڤایەتیێ.</p>
        <button class="btn-play" onclick="openM(0)">🎬 تەماشە بکە</button>
    </div>
</div>

<h2 class="section-title">🔥 تڕێندێن ڤێ حەفتیێ</h2>
<div class="movie-row" id="trending"></div>

<h2 class="section-title">✨ پێشنیارکری بۆ تە</h2>
<div class="movie-row" id="recommended"></div>

<div class="mood-btn" onclick="alert('میزاجێ تە دێ هێتە گوهۆڕین! 🎭')">🎭 میزاجێ تە؟</div>

<div id="modal" class="modal">
    <div class="modal-body">
        <button class="close-x" onclick="closeM()">✕</button>
        <div class="video-box">
            <iframe id="frame" width="100%" height="550px" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        
        <h1 id="mTitle" style="color: var(--accent); margin-top: 30px;"></h1>
        <p id="mDesc" style="color: #ccc; line-height: 1.8;"></p>

        <h3>🎭 ئەکتەرێن سەرەکی</h3>
        <div id="cast" class="cast-list"></div>

        <div class="opinion-section">
            <h3>💬 ڕایێن بینەران (+10 Points)</h3>
            <textarea id="opInput" rows="2" placeholder="ڕایێ خۆ لێرە بنڤیسە..."></textarea>
            <button class="btn-play" style="margin-top: 10px; padding: 8px 20px;" onclick="addOp()">پۆست بکە</button>
            <div id="opList" style="margin-top: 20px;"></div>
        </div>
    </div>
</div>

<script>
    const movies = [
        { 
            id: 0, title: "Interstellar", 
            desc: "گەشتەکا پڕی مەترسی دناڤ گەردوونێ بێ دووماهی دا.", 
            poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", 
            link: "https://www.youtube.com/embed/zSWdZVtXT7E",
            cast: [{n: "Matthew M.", i: "https://m.media-amazon.com/images/M/MV5BMTg0MDc3ODUwOV5BMl5BanBnXkFtZTcwMTk2NjY4Nw@@._V1_.jpg"}, {n: "Anne H.", i: "https://m.media-amazon.com/images/M/MV5BNjA5OTAyNzg3MV5BMl5BanBnXkFtZTcwOTcxMDY3OA@@._V1_.jpg"}],
            ops: []
        },
        { 
            id: 1, title: "The Joker", 
            desc: "چیرۆکا تاری یا ئارسەر فلێک و چەوانیا بوونا وی ب جۆکەر.", 
            poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg", 
            link: "https://www.youtube.com/embed/t433PEQGErc",
            cast: [{n: "Joaquin P.", i: "https://m.media-amazon.com/images/M/MV5BMjA5NTA3NzQ5Nl5BMl5BanBnXkFtZTcwOTYzNjUzMw@@._V1_.jpg"}],
            ops: []
        }
    ];

    let points = localStorage.getItem('userPts') || 0;
    let currentId = null;

    function render() {
        const row = document.getElementById('trending');
        const rec = document.getElementById('recommended');
        const html = movies.map(m => `
            <div class="card" onclick="openM(${m.id})">
                <img src="${m.poster}">
                <div class="card-info">
                    <h4>${m.title}</h4>
                    <small>⭐ 9.0</small>
                </div>
            </div>
        `).join('');
        row.innerHTML = html;
        rec.innerHTML = html;
        document.getElementById('pts').innerText = points;
    }

    function openM(id) {
        currentId = id;
        const m = movies.find(x => x.id === id);
        document.getElementById('frame').src = m.link;
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mDesc').innerText = m.desc;
        
        document.getElementById('cast').innerHTML = m.cast.map(c => `
            <div class="cast-item">
                <img src="${c.i}">
                <div style="font-size: 10px; margin-top: 5px;">${c.n}</div>
            </div>
        `).join('');

        loadOps();
        document.getElementById('modal').style.display = 'block';
    }

    function addOp() {
        const val = document.getElementById('opInput').value;
        if(!val) return;
        movies[currentId].ops.unshift(val);
        points = parseInt(points) + 10;
        localStorage.setItem('userPts', points);
        document.getElementById('pts').innerText = points;
        document.getElementById('opInput').value = "";
        loadOps();
    }

    function loadOps() {
        document.getElementById('opList').innerHTML = movies[currentId].ops.map(o => `
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px;">👤 ${o}</div>
        `).join('');
    }

    function closeM() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('frame').src = "";
    }

    render();
</script>
</body>
</html>

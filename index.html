<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies4U | ئەندامیەت و سینەما</title>
    <style>
        :root { --accent: #ffcc00; --bg: #0b0c10; --card-bg: #1f2833; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }

        /* Navigation */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 5%; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 1000;
        }
        .user-zone { display: flex; align-items: center; gap: 15px; }
        .login-btn { background: var(--accent); color: black; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* Login Modal */
        .auth-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; }
        .auth-form { width: 300px; background: #111; margin: 100px auto; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid var(--accent); }
        .auth-form input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; outline: none; }
        
        /* Grid */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; padding: 40px 5%; filter: blur(0px); transition: 0.5s; }
        .locked { filter: blur(10px); pointer-events: none; }
        
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: 0.4s; cursor: pointer; position: relative; }
        .poster { width: 100%; height: 280px; object-fit: cover; }
        
        /* Lock Overlay */
        .lock-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 500; text-align: center; display: none; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 24px; font-weight: 900; color: var(--accent);">MOVIES4U</div>
    <div class="user-zone" id="userZone">
        <button class="login-btn" onclick="toggleAuthModal(true)">چوونەژوورێ</button>
    </div>
</nav>

<div class="lock-msg" id="lockMsg">
    <h1 style="font-size: 40px;">🔒 هێشتا یا قفلە</h1>
    <p>بۆ دیتنا فیلم و زنجیرەیان، تکایە بچۆ د ژوورڤە</p>
    <button class="login-btn" onclick="toggleAuthModal(true)">نوکە بچۆ د ژوورڤە</button>
</div>

<div class="container" id="mainGrid">
    </div>

<div id="authModal" class="auth-modal">
    <div class="auth-form">
        <h2 style="color: var(--accent);">بخێرهاتی</h2>
        <input type="text" id="userName" placeholder="ناڤێ تە">
        <input type="password" placeholder="کۆد (Password)">
        <button class="login-btn" style="width: 100%;" onclick="login()">چوونەژوورێ</button>
        <p style="font-size: 12px; margin-top: 15px; cursor: pointer;" onclick="toggleAuthModal(false)">پاشگەزبوونەوە</p>
    </div>
</div>

<script>
    let isLoggedIn = false;

    const movies = [
        { id: 1, title: "Breaking Bad", poster: "https://m.media-amazon.com/images/M/MV5BMjhiMzgxZTctNDc1Ni00OTIxLTlhMTUtMzQ3NzQ4NmOtM2Q2XkEyXkFqcGdeQXVyMzE4MDkyNTA@._V1_.jpg" },
        { id: 2, title: "Interstellar", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" },
        { id: 3, title: "Joker", poster: "https://m.media-amazon.com/images/M/MV5BMGQ1ZGQyNTQtYzZkYS00NzU3LTk1ZTYtOWM3NTc5OTFjMWFhXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_.jpg" }
    ];

    function toggleAuthModal(show) {
        document.getElementById('authModal').style.display = show ? 'block' : 'none';
    }

    function login() {
        const name = document.getElementById('userName').value;
        if(name.trim() === "") return alert("تکایە ناڤێ خۆ بنڤیسە");
        
        isLoggedIn = true;
        localStorage.setItem('user', name);
        toggleAuthModal(false);
        checkStatus();
    }

    function logout() {
        isLoggedIn = false;
        localStorage.removeItem('user');
        checkStatus();
    }

    function checkStatus() {
        const user = localStorage.getItem('user');
        const grid = document.getElementById('mainGrid');
        const lockMsg = document.getElementById('lockMsg');
        const userZone = document.getElementById('userZone');

        if(user) {
            grid.classList.remove('locked');
            lockMsg.style.display = 'none';
            userZone.innerHTML = `<span>بخێرهاتی، <b>${user}</b></span> <button class="login-btn" style="background:#ff4757" onclick="logout()">دەرکەفتن</button>`;
            renderMovies();
        } else {
            grid.classList.add('locked');
            lockMsg.style.display = 'block';
            userZone.innerHTML = `<button class="login-btn" onclick="toggleAuthModal(true)">چوونەژوورێ</button>`;
            renderMovies(); // نیشاندان ب شێوازێ فلو (Blur)
        }
    }

    function renderMovies() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = movies.map(m => `
            <div class="card">
                <img src="${m.poster}" class="poster">
                <div style="padding:10px; text-align:center;"><h3>${m.title}</h3></div>
            </div>
        `).join('');
    }

    checkStatus();
</script>
</body>
</html>
